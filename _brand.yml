meta:
  name: Tidy Asset Allocation
  link:
    home: https://www.tidy-pm.com/dev/

# The design follows Tidy Finance: the stock `cosmo` Bootstrap theme carrying a
# single accent colour, one sans typeface throughout, and no ornament. The
# accent here is a light blue rather than Tidy Finance's teal, so the two books
# read as siblings without being mistaken for each other.

color:
  palette:
    # ground and text — cosmo's own neutrals, not a bespoke set
    paper:      "#FFFFFF"
    surface:    "#F8F9FA"
    ink:        "#212529"
    ink-soft:   "#6C757D"
    rule:       "#DEE2E6"
    # the accent, in four steps
    blue:       "#2E77A6"   # links, navigation, primary plot series
    blue-lit:   "#5FA8D3"   # the light blue: rules, markers, second series
    blue-pale:  "#EAF2F8"   # wash: inline code, callout grounds
    blue-deep:  "#1B4F6F"   # hover and pressed states
    # diagnostics — kept away from the accent so a warning never reads as a link
    good:       "#2C6A4C"
    caution:    "#D6A419"
    broken:     "#C0392B"

  foreground: ink
  background: paper
  primary: blue
  secondary: ink-soft
  success: good
  warning: caution
  danger: broken

typography:
  fonts:
    - family: Source Sans 3
      source: google
      weight: [400, 600, 700]
      style: [normal, italic]
    - family: IBM Plex Mono
      source: google
      weight: [400, 500]

  # One family for body and headings, as in cosmo. The earlier serif/sans
  # pairing signalled "essay"; this book is a textbook.
  base:
    family: Source Sans 3
    size: 17px
    line-height: 1.6

  headings:
    family: Source Sans 3
    weight: 600
    line-height: 1.3
    color: ink

  monospace:
    family: IBM Plex Mono
    size: 0.85em

  monospace-inline:
    color: ink
    background-color: blue-pale

  link:
    color: blue
    decoration: none
